# A wt profile: everything about one workspace that the engine does not hard-code. Bash, sourced by
# wt. Only WT_REPO_LIST is required; every other line shows the default. Copy this folder, edit it,
# and select it with WT_PROFILE=<name or path> or `ln -s profiles/<name> profile` beside wt.

# Repos: folder names of the main checkouts under WT_REPOS. `wt new <name> <branch>...` takes one
# branch per repo in this order, or a single branch for all. Each worktree gets every repo.
WT_REPO_LIST="app"
# WT_HOME=<the folder holding wt's folder>   # worktrees go in $WT_HOME/worktrees/<name>
# WT_REPOS=$WT_HOME                          # where the main checkouts live
# WT_REMOTE=origin
# WT_BASE=                                   # start point for new branches; empty: <remote>/HEAD

# Agents: names from agents/ (or this profile's agents/). See agents/README.md.
# WT_AGENTS="claude codex gemini"

# The image: a Debian/Ubuntu release KasmVNC and Playwright ship for (noble, jammy, bookworm, ...).
# WT_USER needs passwordless sudo; it is created, with sudo, if the image lacks it.
# WT_BASE_IMAGE=mcr.microsoft.com/devcontainers/base:noble
# WT_USER=vscode
# WT_USER_HOME=/home/$WT_USER
# Shell run as root at image build, after the desktop and before the agents.
# WT_IMAGE_SETUP='apt-get update && apt-get install -y python3-venv'

# Naming and routing: container <prefix><name>, desktop at http://<prefix><name>.<domain>.
# WT_PREFIX=wt-
# WT_DOMAIN=localhost
# WT_NETWORK=wt                              # Docker network the worktrees join; Traefik is attached to it
# (Traefik's host port is machine-wide, not per profile: WT_HTTP_PORT in the environment, default 80.)

# Folders kept on a per-worktree volume instead of the slow host bind mount: [label:]path.
# Only the container sees their contents: run agents and the IDE in it (wt exec, "Reopen in
# Container"); from the host the folder looks empty. List only what a tool regenerates, never files
# you edit: `wt down` deletes the volume without checking it.
# WT_CACHE_DIRS="app/node_modules app/.venv"

# Container environment, KEY=VALUE. ${localEnv:VAR} reads VAR from your shell when the container
# is created (single-quote those entries). Agents sign in with their own login instead of a key
# here: container environment values show in `docker inspect`.
# WT_ENV=(NODE_ENV=development 'TZ=${localEnv:TZ}')
# HUSKY=0 here skips a repo's husky hooks in every worktree, including hooks git starts on the host
# (they run in the container); leave the checks to CI. See "Git hooks from the host" in the README.

# Host services reached as localhost inside the container (forwarded with socat).
# WT_SHARED_PORTS="5432 6379"
# Ports this profile's isolated.sh replaces with per-worktree services under `--infra isolated`.
# WT_ISOLATABLE_PORTS=""
# A port `wt start` checks on the host, warning when the shared infra is down.
# WT_INFRA_PROBE_PORT=

# Ignored paths that are safe to lose on `wt down`, as extended regex alternations, on top of the
# built-in list (node_modules, bin, obj, dist, build, target, .venv, __pycache__, ...).
# WT_DISPOSABLE_DIRS='\.terraform|vendor'
# WT_DISPOSABLE_FILES='\.coverage'

# Optional files beside this one:
#   post-start.d/*.sh  run in the container on every start, in name order (env: WT_DIR, WT_NAME, WT_INFRA)
#   bin/               on the container's PATH (files must be executable)
#   isolated.sh        `isolated.sh up|down|purge` on the host, with WT_NAME and WT_CONTAINER set,
#                      for per-worktree services; enables `wt new --infra isolated`
#   agents/<agent>.sh  agent definitions that override or add to the engine's
